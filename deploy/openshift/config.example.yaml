# deploy/openshift/config.example.yaml
# Non-secret settings. Copy, edit, apply.
apiVersion: v1
kind: ConfigMap
metadata:
  name: duapi-config
data:
  PORT: "8080"
  STATIC_DIR: "/app/public"
  DB_PATH: "/data/data.db"
  GLOBAL_ADMINS: "dutopia-admins"
  # Scoped admins: full admin inside their roots, self-only elsewhere.
  # STORAGE_ADMINS: "user1:/red/nas1,/red/nas2;user2:/red/ssd"
  # Mount points duscan scans (each has <fs>/.stats). The home page lists
  # them, and only paths inside them can be trashed (into <fs>/.trash).
  FILESYSTEMS: "/red/nas1,/red/nas2"
  # Trash queue (queue.json) on the PVC; this is the default.
  # TRASH_DIR: "/data/trash"
  # Hours Keep can undo, and days moved items stay in <fs>/.trash before
  # the cron purges them (it reads this from /api/health). Defaults:
  # TRASH_UNDO_HOURS: "24"
  # TRASH_KEEP_DAYS: "30"
  REQUEST_TIMEOUT_SECS: "30"
  MAX_BODY_BYTES: "65536"
  MAX_PAGE_SIZE: "2000"
  RUST_LOG: "info"

  # ---- OIDC / Keycloak ----
  # Password login calls `su`, which cannot work in this container (no local
  # accounts, unprivileged UID). On OpenShift, OIDC is the usable auth path.
  OIDC_ISSUER: "https://keycloak.corp.local/realms/dutopia"
  OIDC_CLIENT_ID: "duapi"
  # Must match the Route host exactly, and be registered in Keycloak.
  OIDC_REDIRECT_URI: "https://dutopia.apps.ocp.corp.local/api/auth/callback"
  # Only when Keycloak uses a private/self-signed CA; mount the bundle too.
  # OIDC_CA_CERT: "/etc/pki/corp/ca.pem"
